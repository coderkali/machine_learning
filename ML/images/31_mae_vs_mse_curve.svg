<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="580" height="430" fill="#ffffff"/>
  <text x="290" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1c1c">MAE vs. MSE — how each one reacts to error size</text>

  <!-- gridlines -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="60" y1="350" x2="540" y2="350"/>
    <line x1="60" y1="272.5" x2="540" y2="272.5"/>
    <line x1="60" y1="195" x2="540" y2="195"/>
    <line x1="60" y1="117.5" x2="540" y2="117.5"/>
    <line x1="60" y1="40" x2="540" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="350"/>
    <line x1="180" y1="40" x2="180" y2="350"/>
    <line x1="300" y1="40" x2="300" y2="350"/>
    <line x1="420" y1="40" x2="420" y2="350"/>
    <line x1="540" y1="40" x2="540" y2="350"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="350" x2="540" y2="350" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="300" y1="40" x2="300" y2="350" stroke="#1c1c1c" stroke-width="2"/>

  <!-- y tick labels -->
  <g font-size="12" fill="#3a3d42">
    <text x="48" y="354" text-anchor="end">0</text>
    <text x="48" y="276.5" text-anchor="end">4</text>
    <text x="48" y="199" text-anchor="end">8</text>
    <text x="48" y="121.5" text-anchor="end">12</text>
    <text x="48" y="44" text-anchor="end">16</text>
  </g>

  <!-- x tick labels -->
  <g font-size="12" fill="#3a3d42" text-anchor="middle">
    <text x="60" y="368">-4</text>
    <text x="180" y="368">-2</text>
    <text x="300" y="368">0</text>
    <text x="420" y="368">2</text>
    <text x="540" y="368">4</text>
  </g>

  <!-- axis titles -->
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#1c1c1c">error size (actual − predicted)</text>
  <text x="0" y="0" text-anchor="middle" font-size="13" fill="#1c1c1c" transform="translate(20,195) rotate(-90)">penalty (how much this error "costs")</text>

  <!-- MSE curve: v = e^2 -->
  <polyline points="60,40 120,175.625 180,272.5 240,330.625 300,350 360,330.625 420,272.5 480,175.625 540,40"
            fill="none" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round"/>

  <!-- MAE curve: v = |e|, a straight V -->
  <polyline points="60,272.5 300,350 540,272.5" fill="none" stroke="#b3781f" stroke-width="3" stroke-linejoin="round"/>

  <!-- sharp-corner callout -->
  <circle cx="300" cy="350" r="5" fill="#b3781f" stroke="white" stroke-width="1.5"/>
  <line x1="180" y1="300" x2="292" y2="346" stroke="#b3781f" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="176" y="285" font-size="11.5" fill="#b3781f" text-anchor="end" font-weight="bold">MAE makes a sharp "V" here —</text>
  <text x="176" y="300" font-size="11.5" fill="#b3781f" text-anchor="end" font-weight="bold">no smooth dip to settle into</text>

  <!-- growth-gap callout at e = 4 -->
  <line x1="540" y1="40" x2="540" y2="272.5" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="533" y="34" font-size="12" fill="#2f6fed" text-anchor="end" font-weight="bold">MSE: 16</text>
  <text x="533" y="266" font-size="12" fill="#b3781f" text-anchor="end" font-weight="bold">MAE: 4</text>

  <!-- legend -->
  <line x1="90" y1="58" x2="115" y2="58" stroke="#2f6fed" stroke-width="3"/>
  <text x="122" y="62" font-size="12" fill="#1c1c1c">MSE = squared error (smooth curve)</text>
  <line x1="90" y1="76" x2="115" y2="76" stroke="#b3781f" stroke-width="3"/>
  <text x="122" y="80" font-size="12" fill="#1c1c1c">MAE = absolute error (straight "V")</text>

  <text x="290" y="416" text-anchor="middle" font-size="11" fill="#8a8f98">Same error, two very different reactions — MSE punishes big misses hard; MAE grows steady and proportional.</text>
</svg>
