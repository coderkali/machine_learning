<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="260" fill="#ffffff"/>

  <!-- Panel 1: c > 0 -->
  <g>
    <line x1="130" y1="25" x2="130" y2="220" stroke="#1c1c1c" stroke-width="1.5"/>
    <line x1="30" y1="125" x2="230" y2="125" stroke="#1c1c1c" stroke-width="1.5"/>
    <line x1="60" y1="100" x2="200" y2="45" stroke="#2f6fed" stroke-width="3"/>
    <circle cx="130" cy="72.5" r="5" fill="#2f9e6f"/>
    <line x1="105" y1="72.5" x2="125" y2="72.5" stroke="#2f9e6f" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="95" y="68" text-anchor="end" font-size="12" fill="#2f9e6f" font-weight="bold">c</text>
    <text x="130" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1c">c &gt; 0</text>
    <text x="130" y="255" text-anchor="middle" font-size="11" fill="#3a3d42">line crosses y-axis above the origin — whole line shifted up</text>
  </g>

  <!-- Panel 2: c < 0 -->
  <g>
    <line x1="370" y1="25" x2="370" y2="220" stroke="#1c1c1c" stroke-width="1.5"/>
    <line x1="270" y1="125" x2="470" y2="125" stroke="#1c1c1c" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="440" y2="120" stroke="#2f6fed" stroke-width="3"/>
    <circle cx="370" cy="160" r="5" fill="#b33a3a"/>
    <line x1="345" y1="160" x2="365" y2="160" stroke="#b33a3a" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="335" y="164" text-anchor="end" font-size="12" fill="#b33a3a" font-weight="bold">c</text>
    <text x="370" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1c">c &lt; 0</text>
    <text x="370" y="255" text-anchor="middle" font-size="11" fill="#3a3d42">line crosses y-axis below the origin — whole line shifted down</text>
  </g>
</svg>
