<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="580" height="430" fill="#ffffff"/>
  <text x="290" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1c1c">cgpa → package: scatter + line of regression</text>

  <!-- gridlines -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="115.8" y1="40" x2="115.8" y2="350"/>
    <line x1="227.4" y1="40" x2="227.4" y2="350"/>
    <line x1="339.1" y1="40" x2="339.1" y2="350"/>
    <line x1="450.7" y1="40" x2="450.7" y2="350"/>
    <line x1="60" y1="292.6" x2="540" y2="292.6"/>
    <line x1="60" y1="177.8" x2="540" y2="177.8"/>
    <line x1="60" y1="63.0" x2="540" y2="63.0"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="350" x2="540" y2="350" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="60" y1="40" x2="60" y2="350" stroke="#1c1c1c" stroke-width="2"/>

  <!-- tick labels -->
  <g font-size="12" fill="#3a3d42">
    <text x="115.8" y="368" text-anchor="middle">5</text>
    <text x="227.4" y="368" text-anchor="middle">6</text>
    <text x="339.1" y="368" text-anchor="middle">7</text>
    <text x="450.7" y="368" text-anchor="middle">8</text>
    <text x="48" y="296.6" text-anchor="end">2</text>
    <text x="48" y="181.8" text-anchor="end">3</text>
    <text x="48" y="67.0" text-anchor="end">4</text>
  </g>

  <!-- axis titles -->
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#1c1c1c">cgpa — independent variable (x)</text>
  <text x="0" y="0" text-anchor="middle" font-size="13" fill="#1c1c1c" transform="translate(20,230) rotate(-90)">package in LPA — dependent variable (y)</text>

  <!-- fitted line -->
  <line x1="60" y1="336.7" x2="540" y2="74.0" stroke="#2f6fed" stroke-width="3"/>
  <text x="465" y="90" font-size="12" fill="#2f6fed" font-weight="bold">line of regression</text>

  <!-- residual: above the line (point at cgpa 7.42, package 3.67) -->
  <line x1="385.9" y1="100.9" x2="385.9" y2="158.3" stroke="#b33a3a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="392" y="132" font-size="11" fill="#b33a3a">residual (above line)</text>

  <!-- residual: below the line (point at cgpa 7.89, package 2.99) -->
  <line x1="438.4" y1="178.9" x2="438.4" y2="129.6" stroke="#b3781f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="234" y="205" font-size="11" fill="#b3781f">residual (below line) →</text>

  <!-- data points -->
  <g fill="#1c1c1c">
    <circle cx="326.8" cy="147.9" r="5"/>
    <circle cx="129.2" cy="294.9" r="5"/>
    <circle cx="430.6" cy="149.1" r="5"/>
    <circle cx="385.9" cy="100.9" r="5"/>
    <circle cx="332.4" cy="112.3" r="5"/>
    <circle cx="438.4" cy="178.9" r="5"/>
    <circle cx="309.0" cy="223.7" r="5"/>
    <circle cx="311.2" cy="237.5" r="5"/>
    <circle cx="237.5" cy="257.0" r="5"/>
    <circle cx="485.3" cy="119.2" r="5"/>
    <circle cx="151.5" cy="308.7" r="5"/>
  </g>

  <text x="290" y="416" text-anchor="middle" font-size="11" fill="#8a8f98">Line fit by least squares on these 11 rows: y ≈ 0.53x − 0.78 (m ≈ 0.53, c ≈ −0.78)</text>
</svg>
